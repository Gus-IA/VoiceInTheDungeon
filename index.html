<!doctype html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice in the Dungeon - Proto</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        max-width: 800px;
        margin: 1rem auto;
        padding: 0 1rem;
        background: #050816;
        color: #e5e7eb;
        line-height: 1.5;
      }
      h1 {
        text-align: center;
        margin-bottom: 1.5rem;
        font-size: 1.75rem;
      }
      #log {
        border-radius: 0.5rem;
        border: 1px solid #4b5563;
        padding: 1rem;
        height: 50vh;
        min-height: 300px;
        max-height: 600px;
        overflow-y: auto;
        white-space: pre-wrap;
        background: #020617;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
          Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }
      .controls-row {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      .input-group {
        flex: 1;
        display: flex;
        gap: 0.5rem;
      }
      button {
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        box-shadow: 0 8px 20px rgba(22, 163, 74, 0.4);
        transition: transform 0.1s, box-shadow 0.1s;
        white-space: nowrap;
      }
      @media (max-width: 640px) {
        body {
          margin: 0.5rem auto;
        }
        h1 {
          font-size: 1.5rem;
          margin-bottom: 1rem;
        }
        #log {
          height: 45vh;
          font-size: 0.85rem;
        }
        .controls-row {
          flex-direction: column;
          align-items: stretch;
          gap: 0.75rem;
        }
        .input-group {
          width: 100%;
        }
        .secondary-controls {
          justify-content: space-between;
        }
        button {
          width: 100%;
          padding: 0.8rem 1rem;
        }
        #sendBtn {
            width: auto;
        }
      }
      button:active {
        transform: translateY(2px);
        box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }
      .status {
        margin-top: 0.5rem;
        font-size: 0.85rem;
        color: #9ca3af;
        text-align: center;
      }
      input[type="text"], input[type="password"], select {
        padding: 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #4b5563;
        background: #0f172a;
        color: white;
        font-size: 1rem;
      }
      input[type="text"]:focus {
        outline: 2px solid #22c55e;
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <h1>Voice in the Dungeon (proto)</h1>
    
    <div id="authContainer">
        <div id="authStatus"></div>
        <button id="logoutBtn" style="display:none; background: #6b7280; font-size: 0.8rem; margin-top: 0;">Cerrar sesión</button>
    </div>

    <div id="loginModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100; align-items:center; justify-content:center; padding: 1rem;">
        <div style="background:#1e293b; padding:2rem; border-radius:1rem; border:1px solid #4b5563; width:100%; max-width:350px; box-shadow:0 20px 50px rgba(0,0,0,0.5);">
            <h2 id="modalTitle" style="margin-top:0; text-align: center;">Entrar al calabozo</h2>
            <div style="display:flex; flex-direction:column; gap:1rem;">
                <input type="text" id="usernameInput" placeholder="Usuario">
                <input type="password" id="passwordInput" placeholder="Contraseña">
                <button id="authBtn">Entrar</button>
                <button id="toggleAuthMode" style="background:none; box-shadow:none; font-size:0.8rem; text-decoration:underline;">¿No tienes cuenta? Regístrate</button>
            </div>
            <div id="authMsg" style="margin-top:1rem; color:#ef4444; font-size:0.85rem; text-align: center;"></div>
        </div>
    </div>

    <div id="gameUI" style="display:none;">
        <div id="log"></div>
        
        <div class="controls-row">
            <button id="speakBtn">
                <span>🎙️</span>
                <span>Hablar</span>
            </button>
            <div class="input-group">
                <input type="text" id="textInput" placeholder="Escribe un comando..." style="flex:1; border-radius:999px;">
                <button id="sendBtn" style="padding: 0.6rem 1.2rem; border-radius: 999px;">Enviar</button>
            </div>
        </div>

        <div class="controls-row secondary-controls" style="flex-wrap: wrap;">
            <div style="display:flex; gap: 0.5rem; flex: 1; min-width: 200px;">
                <button id="saveBtn" style="background:#3b82f6; font-size: 0.85rem; flex: 1;">💾 Guardar</button>
                <button id="loadBtn" style="background:#8b5cf6; font-size: 0.85rem; flex: 1;">📂 Cargar</button>
            </div>
            
            <div style="display:flex; align-items:center; gap:0.5rem; background: #0f172a; padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid #4b5563;">
                <label for="langSelect" style="font-size: 0.8rem; color: #94a3b8;">Idioma:</label>
                <select id="langSelect" style="padding:0.2rem; border:none; background:transparent; font-size: 0.8rem;">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                </select>
            </div>
        </div>
        <div class="status" id="status"></div>
    </div>
    
    <script type="module" src="./main.js"></script>
  </body>
</html>
