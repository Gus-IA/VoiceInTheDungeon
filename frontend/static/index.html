<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Voice in the Dungeon</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, rgba(34, 197, 94, 0.15), transparent 55%),
                        radial-gradient(circle at bottom, rgba(15, 23, 42, 0.9), #020617);
            color: #e5e7eb;
        }
        .frame {
            width: 100%;
            max-width: 900px;
            margin: 2rem 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.4);
            background: radial-gradient(circle at top left, #020617, #020617 45%, #030712);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.9), 0 0 0 1px rgba(15, 23, 42, 0.8);
            padding: 1.5rem 1.75rem 1.75rem;
            margin: 0 auto;
            position: relative;
            height: 100vh;
            overflow: hidden;
        }
        .frame-inner {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 0;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(55, 65, 81, 0.5);
            flex-shrink: 0;
        }
        .title-block { display: flex; flex-direction: column; gap: 0.15rem; }
        h1 { font-size: 1.5rem; margin: 0; background: linear-gradient(to right, #60a5fa, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .subtitle { font-size: 0.8rem; color: #9ca3af; }
        .badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(34, 197, 94, 0.4);
            background: rgba(15, 23, 42, 0.9);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #bbf7d0;
        }
        .badge-dot { width: 7px; height: 7px; border-radius: 999px; background: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.9); }
        #authStatus { font-size: 0.85rem; color: #bbf7d0; margin-right: 1rem; }
        #log {
            border-radius: 0.75rem;
            border: 1px solid rgba(55, 65, 81, 0.9);
            padding: 0.75rem 1rem;
            flex: 1;
            min-height: 100px;
            overflow-y: auto;
            background: radial-gradient(circle at top left, #020617, #020617 40%, #020617);
            font-family: "JetBrains Mono", monospace;
            font-size: 0.875rem;
        }
        .log-entry { display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 0.5rem; padding: 0.4rem 0.6rem; border-radius: 0.35rem; border-left: 3px solid transparent; }
        .log-entry--player { border-left-color: #3b82f6; background: rgba(59, 130, 246, 0.08); }
        .log-entry--game { border-left-color: rgba(34, 197, 94, 0.7); background: rgba(15, 23, 42, 0.5); }
        .log-time { font-size: 0.7rem; color: #6b7280; }
        .log-text { flex: 1; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
        .log-entry--player .log-text { color: #93c5fd; font-weight: 500; }
        button {
            margin-top: 0.1rem;
            padding: 0.6rem 1.4rem;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.4);
        }
        #saveBtn, #loadBtn { background: rgba(15,23,42,0.95); border: 1px solid rgba(55,65,81,0.9); box-shadow: none; font-size: 0.8rem; padding: 0.4rem 1rem; }
        .input { flex: 1; padding: 0.55rem 0.85rem; border-radius: 999px; border: 1px solid #4b5563; background: #020617; color: #e5e7eb; outline: none; }
        #sendBtn { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .is-listening {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            animation: pulse 1.5s infinite;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4) !important;
        }

        .status { margin-top: 0.6rem; font-size: 0.8rem; color: #9ca3af; }
        .scene {
            background: #0f172a;
            border-radius: 0.75rem;
            padding: 0.5rem;
            border: 1px solid rgba(55, 65, 81, 0.8);
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        /* Modal Auth Styles */
        #loginModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: #030712; padding: 2.5rem; border-radius: 1.5rem;
            border: 1px solid rgba(148, 163, 184, 0.2); width: 100%; max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .modal-content input {
            width: 100%; margin-bottom: 1rem; padding: 0.75rem 1rem;
            border-radius: 0.75rem; border: 1px solid #334155; background: #0f172a; color: white;
        }

        /* Adventure Journal Styles */
        #journal-container {
            margin-bottom: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(34, 197, 94, 0.3);
            display: none; /* Se muestra cuando hay entradas */
        }
        #journal-container h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0 0 0.5rem 0;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        #journal-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
            max-height: 120px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #journal-list li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.2rem;
        }
        #journal-list li::before {
            content: "◆";
            position: absolute;
            left: 0;
            color: #22c55e;
            font-size: 0.6rem;
            top: 0.1rem;
        }

        /* Minimap & Journal Layout */
        .status-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        @media (max-width: 600px) {
            .status-panels {
                grid-template-columns: 1fr;
            }
        }

        #minimap-wrapper {
            position: relative;
            padding: 1rem;
            background: #020617;
            border-radius: 0.9rem;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: inset 0 0 15px rgba(59, 130, 246, 0.1);
        }
        .direction-label {
            position: absolute;
            font-size: 0.6rem;
            color: #3b82f6;
            font-weight: bold;
            opacity: 0.7;
        }
        .label-n { top: 0.2rem; left: 50%; transform: translateX(-50%); }
        .label-s { bottom: 0.2rem; left: 50%; transform: translateX(-50%); }
        .label-e { right: 0.2rem; top: 50%; transform: translateY(-50%); }
        .label-w { left: 0.2rem; top: 50%; transform: translateY(-50%); }

        #minimap-container {
            display: grid;
            gap: 4px;
            justify-items: center;
            align-items: center;
            min-height: 100px;
        }
        .map-cell {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 1px solid #1e293b;
            background: rgba(30, 41, 59, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
            position: relative;
            transition: all 0.3s ease;
        }
        .map-cell.visited {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
        .map-cell.current {
            background: #3b82f6;
            border-color: #60a5fa;
            box-shadow: 0 0 15px #3b82f6;
            z-index: 2;
        }
        .map-cell.current::after {
            content: "🧙";
            font-size: 1rem;
        }
        /* Room connections */
        .map-cell.door-n { border-top-color: rgba(59, 130, 246, 0.8) !important; border-top-width: 2px; }
        .map-cell.door-s { border-bottom-color: rgba(59, 130, 246, 0.8) !important; border-bottom-width: 2px; }
        .map-cell.door-e { border-right-color: rgba(59, 130, 246, 0.8) !important; border-right-width: 2px; }
        .map-cell.door-w { border-left-color: rgba(59, 130, 246, 0.8) !important; border-left-width: 2px; }
    </style>
</head>
<body>
    <div id="loginModal" style="display:none;">
        <form id="authForm" class="modal-content">
            <h2 id="modalTitle" style="margin-top:0; margin-bottom:1.5rem; text-align:center;">Entrar al calabozo</h2>
            <input type="text" id="usernameInput" placeholder="Nombre de usuario" required>
            <input type="password" id="passwordInput" placeholder="Contraseña" required>
            <button id="authBtn" type="submit" style="width:100%;">Entrar</button>
            <button type="button" id="toggleAuthMode" style="background:none; box-shadow:none; font-size:0.85rem; width:100%; text-decoration:underline; color:#94a3b8; margin-top:0.5rem;">¿No tienes cuenta? Regístrate</button>
            <div id="authMsg" style="margin-top:1rem; text-align:center; color:#ef4444; font-size:0.85rem;"></div>
        </form>
    </div>

    <div class="frame" id="gameUI" style="display:none;">
        <div class="frame-inner">
            <header>
                <div class="title-block">
                    <h1>Voice in the Dungeon</h1>
                    <div class="subtitle">Aventura de voz en una mazmorra oscura</div>
                </div>
                <div style="display:flex; align-items:center;">
                    <div id="authStatus"></div>
                    <button id="logoutBtn" style="display:none; background:#475569; font-size:0.75rem; padding:0.3rem 0.8rem; margin-top:0;">Salir</button>
                </div>
            </header>
            
            <div class="scene">
                <p style="font-size:0.85rem; color:#94a3b8; margin:0;">
                    <strong>Despiertas en una cámara de piedra.</strong> Una puerta arqueada se abre hacia la oscuridad. Tu voz es la única herramienta para escapar.
                </p>
                <div style="background:radial-gradient(circle, #064e3b, #020617); border-radius:0.5rem; height:80px; display:flex; align-items:center; justify-content:center; border:1px solid #065f46;">
                    <span style="font-size:2rem;">👁️</span>
                </div>
            </div>

            <div class="status-panels">
                <div id="minimap-wrapper">
                    <span class="direction-label label-n">N</span>
                    <span class="direction-label label-s">S</span>
                    <span class="direction-label label-e">E</span>
                    <span class="direction-label label-w">W</span>
                    <div id="minimap-container">
                        <!-- Se poblará dinámicamente -->
                    </div>
                </div>

                <div id="journal-container" style="display:none;">
                    <h3 style="font-size: 0.8rem; margin: 0 0 0.5rem 0; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.05rem;">📜 Registro</h3>
                    <ul id="journal-list" style="margin: 0; padding-left: 1.2rem; font-size: 0.75rem; color: #94a3b8; list-style-type: '✧ ';"></ul>
                </div>
            </div>

            <div id="log" role="log"></div>
            <canvas id="visualizer" width="300" height="40" style="width: 100%; height: 40px; margin-top: 1rem; border-radius: 0.5rem; display: none; background: #0f172a; border: 1px solid rgba(148, 163, 184, 0.2); box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.5);"></canvas>

            <div style="margin-top:1rem; display:flex; gap:0.5rem; align-items:center;">
                <button id="speakBtn">🎙️ Hablar</button>
                <input id="textInput" type="text" placeholder="Escribe un comando..." class="input">
                <button id="sendBtn">Enviar</button>
            </div>

            <div class="status" id="status"></div>

            <div style="margin-top:1rem; display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
                <button id="saveBtn">💾 Guardar</button>
                <button id="loadBtn">📂 Cargar</button>
                <button id="resetBtn" onclick="resetGame()" style="background:#ef4444; border:none; box-shadow:none; font-size:0.8rem; padding:0.4rem 1rem;">🔄 Reiniciar</button>
                <div style="margin-left:auto; display:flex; align-items:center; gap:0.5rem;">
                    <span style="font-size:0.75rem; color:#6b7280;">🌍 Idioma automático</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Cargar scripts desde /static para evitar 404 en subrutas -->
    <script type="module" src="/static/main.js?v=9"></script>
</body>
</html>
